title: "Oscar Lange"
description: "Academic website — research, teaching, and a blog on corporate finance theory and real analysis."
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

author:
  name: "Oscar Lange"
  email: "oscar.lange@dauphine.psl.eu"     # used for the mail icon and the "reach out" line

# Contact icons under the bio (each one shows only if set)
# linkedin_username: "your-linkedin-handle"
# scholar_url: "https://scholar.google.com/citations?user=..."
# institution_url: "https://dauphine.psl.eu/..."
github_username: longeford

# Footer
footer:
  address: |
    Université Paris Dauphine – PSL
    Place du Maréchal de Lattre de Tassigny
    75016 Paris, France
  disclaimer: "The views expressed on this website are my own."

# Profile photo (optional). Put the image in assets/img/ and uncomment.
# photo: /assets/img/profile.jpg

# Banner image across the top of the About page (optional).
# banner: /assets/img/banner.jpg

# CV: the Dropbox *shared link to the PDF file* (Share -> Copy link).
# Overwrite the file in Dropbox with the same name and the site updates automatically.
cv_dropbox_url: ""

# Order of the tabs in the top navigation
header_pages:
  - index.md
  - cv.md
  - research.md
  - teaching.md
  - blog.md

# Blog posts live under /blog/
permalink: /blog/:year/:month/:day/:title/

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge
