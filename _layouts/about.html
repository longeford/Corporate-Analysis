---
layout: base
---
<article class="post about">

  {%- if site.banner -%}
    <div class="banner" style="background-image: url('{{ site.banner | relative_url }}');"></div>
  {%- endif -%}

  {%- if site.photo -%}
    <img class="profile-photo" src="{{ site.photo | relative_url }}" alt="Photo of {{ site.author.name | escape }}">
  {%- endif -%}

  <div class="post-content">
    {{ content }}
  </div>

  {%- include contact-icons.html -%}

</article>
